name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore CPMM2067.sln

      - name: Build (Release)
        run: dotnet build CPMM2067.sln -c Release --no-restore

      - name: Test
        run: dotnet test tests/CPMM2067.Tests --no-build -c Release --verbosity normal

      - name: Publish self-contained .exe
        run: |
          dotnet publish src/CPMM2067.App/CPMM2067.App.csproj `
            -c Release -r win-x64 --self-contained true `
            /p:PublishSingleFile=true `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            -o publish/win-x64

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: CPMM2067-win-x64
          path: publish/win-x64/
          retention-days: 14
